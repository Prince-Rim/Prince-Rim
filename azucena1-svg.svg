<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 10px; }
      .name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 32px; font-weight: 700; fill: #ffffff; }
      .title { font-family: "JetBrains Mono", Consolas, monospace; font-size: 16px; font-weight: 600; fill: #58a6ff; }
      .tags { font-family: "JetBrains Mono", Consolas, monospace; font-size: 13px; fill: #8b949e; }
      .screen-bg { fill: #070a0e; stroke: #21262d; stroke-width: 2; rx: 8px; }
      .bezel { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 12px; }
      .dot { rx: 1px; }
      .version { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; fill: #484f58; }
    </style>
    <clipPath id="screen-clip">
      <rect x="592" y="44" width="196" height="92" rx="8" />
    </clipPath>
  </defs>

  <rect width="848" height="198" x="1" y="1" class="bg" />

  <!-- Left Text Info -->
  <text x="50" y="70" class="name">Justin Allen</text>
  <text x="50" y="105" class="title">Full-Stack Developer &amp; Systems Builder</text>
  <text x="50" y="138" class="tags">ASP.NET Core  •  Java  •  SSA + LSTM  •  PostgreSQL</text>

  <!-- Right Retro Screen Terminal -->
  <rect x="580" y="32" width="220" height="135" class="bezel" />
  <rect x="592" y="44" width="196" height="92" class="screen-bg" />

  <g clip-path="url(#screen-clip)">
    <!-- Floor Shadow Beneath Cat -->
    <ellipse cx="690" cy="118" rx="16" ry="3.5" fill="#000000" opacity="0.6">
      <animate attributeName="rx" values="16; 14; 16" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6; 0.35; 0.6" dur="1.6s" repeatCount="indefinite" />
    </ellipse>

    <!-- Cat Group -->
    <g transform="translate(675, 78)">
      <!-- Wagging Tail -->
      <g>
        <animateTransform 
          attributeName="transform" 
          type="rotate" 
          values="0 26 26; 15 26 26; 0 26 26" 
          dur="2s" 
          repeatCount="indefinite" />
        <rect x="24" y="16" width="4" height="12" fill="#d29922" class="dot"/>
        <rect x="26" y="12" width="4" height="6" fill="#d29922" class="dot"/>
      </g>

      <!-- Cat Body & Head Breathing/Bobbing -->
      <g>
        <animateTransform 
          attributeName="transform" 
          type="translate" 
          values="0,0; 0,-2; 0,0" 
          dur="1.6s" 
          repeatCount="indefinite" />
        
        <!-- Ears -->
        <polygon points="4,2 10,2 7,-3" fill="#e3b341" />
        <polygon points="18,2 24,2 21,-3" fill="#e3b341" />
        
        <!-- Head -->
        <rect x="3" y="2" width="22" height="14" fill="#d29922" class="dot"/>
        
        <!-- Eyes (Blinking) -->
        <rect x="7" y="6" width="3" height="4" fill="#070a0e">
          <animate attributeName="height" values="4; 1; 4" keyTimes="0; 0.95; 1" dur="3.5s" repeatCount="indefinite" />
        </rect>
        <rect x="18" y="6" width="3" height="4" fill="#070a0e">
          <animate attributeName="height" values="4; 1; 4" keyTimes="0; 0.95; 1" dur="3.5s" repeatCount="indefinite" />
        </rect>

        <!-- Body & Paws -->
        <rect x="5" y="16" width="18" height="14" fill="#bb8009" class="dot"/>
        <rect x="6" y="28" width="5" height="3" fill="#f0e6d2" rx="1"/>
        <rect x="17" y="28" width="5" height="3" fill="#f0e6d2" rx="1"/>
      </g>
    </g>

    <!-- Retro CRT Scanning Line (Moves Up and Down) -->
    <line x1="592" y1="44" x2="788" y2="44" stroke="#3fb950" stroke-width="2" opacity="0.35">
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="0,0; 0,92; 0,0" 
        dur="4s" 
        repeatCount="indefinite" />
    </line>
  </g>

  <!-- Hardware Indicators -->
  <rect x="600" y="146" width="14" height="8" fill="#238636" rx="2" />
  <rect x="620" y="146" width="14" height="8" fill="#388bfd" rx="2" />
  <circle cx="770" cy="150" r="4" fill="#30363d" />
  <circle cx="784" cy="150" r="4" fill="#388bfd">
    <animate attributeName="opacity" values="1; 0.15; 1" dur="1.2s" repeatCount="indefinite" />
  </circle>

  <!-- Version Tag -->
  <text x="795" y="188" text-anchor="end" class="version">v2.4.0</text>
</svg>
