<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 10px; }
      .name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 32px; font-weight: 700; fill: #ffffff; }
      .title { font-family: "JetBrains Mono", Consolas, monospace; font-size: 16px; font-weight: 600; fill: #58a6ff; }
      .tags { font-family: "JetBrains Mono", Consolas, monospace; font-size: 13px; fill: #8b949e; }
      .screen-bg { fill: #070a0e; stroke: #21262d; stroke-width: 2; rx: 8px; }
      .bezel { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 12px; }
      .dot { rx: 2px; }
      .version { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; fill: #484f58; }
    </style>

    <clipPath id="screen-clip">
      <rect x="592" y="44" width="196" height="92" rx="8" />
    </clipPath>
  </defs>

  <!-- Main Card Outline -->
  <rect width="848" height="198" x="1" y="1" class="bg" />

  <!-- Left Text Info -->
  <text x="50" y="70" class="name">Justin Allen</text>
  <text x="50" y="105" class="title">Full-Stack Developer &amp; Systems Builder</text>
  <text x="50" y="138" class="tags">ASP.NET Core  •  Laravel  •  SSA + LSTM  •  PostgreSQL</text>

  <!-- Right Retro Screen Terminal -->
  <rect x="580" y="32" width="220" height="135" class="bezel" />
  <rect x="592" y="44" width="196" height="92" class="screen-bg" />

  <!-- Screen Contents with Clip -->
  <g clip-path="url(#screen-clip)">
    <!-- Moving Scanline -->
    <line x1="592" y1="44" x2="788" y2="44" stroke="#3fb950" stroke-width="2" opacity="0.35">
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="0,0; 0,92; 0,0" 
        dur="4s" 
        repeatCount="indefinite" />
    </line>

    <!-- Pulsing Shadow -->
    <ellipse cx="690" cy="116" rx="14" ry="3.5" fill="#000000" opacity="0.6">
      <animate 
        attributeName="rx" 
        values="14; 9; 14" 
        dur="2.4s" 
        repeatCount="indefinite" />
      <animate 
        attributeName="opacity" 
        values="0.6; 0.2; 0.6" 
        dur="2.4s" 
        repeatCount="indefinite" />
    </ellipse>

    <!-- Floating Alien Sprite -->
    <g fill="#3fb950">
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="0,0; 0,-8; 0,0" 
        dur="2.4s" 
        keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"
        calcMode="spline"
        repeatCount="indefinite" />
      
      <g transform="translate(678, 65)">
        <rect x="6" y="0" width="12" height="3" class="dot"/>
        <rect x="3" y="3" width="18" height="3" class="dot"/>
        <rect x="0" y="6" width="24" height="6" class="dot"/>
        <rect x="0" y="12" width="6" height="6" class="dot"/>
        <rect x="9" y="12" width="6" height="6" class="dot"/>
        <rect x="18" y="12" width="6" height="6" class="dot"/>
        <rect x="3" y="18" width="6" height="3" class="dot"/>
        <rect x="15" y="18" width="6" height="3" class="dot"/>
      </g>
    </g>
  </g>

  <!-- Hardware Indicators -->
  <rect x="600" y="146" width="14" height="8" fill="#238636" rx="2" />
  <rect x="620" y="146" width="14" height="8" fill="#388bfd" rx="2" />
  <circle cx="770" cy="150" r="4" fill="#30363d" />
  
  <!-- Blinking Blue LED -->
  <circle cx="784" cy="150" r="4" fill="#388bfd">
    <animate 
      attributeName="opacity" 
      values="1; 0.15; 1" 
      dur="1.2s" 
      repeatCount="indefinite" />
  </circle>

  <!-- Version Tag -->
  <text x="795" y="188" text-anchor="end" class="version">v2.4.0</text>
</svg>
